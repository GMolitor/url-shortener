server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: url-shortener
  datasource:
    url: jdbc:sqlite:${DATABASE_PATH:./data/url-shortener.sqlite}
    driver-class-name: org.sqlite.JDBC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  public-origin: ${PUBLIC_ORIGIN:http://localhost:8080}
